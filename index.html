<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Media & Library Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Soft Beige Palette */
      --bg-primary: #fbf8f2;
      --bg-surface: #f4eee3;
      --bg-card: #ffffff;
      --bg-card-hover: #faf6ee;
      --bg-elevated: #eae1d2;
      --text-main: #4a4036;
      --text-muted: #7d7063;
      --text-subtle: #a89a8c;
      --border-color: #e5dac9;

      /* Pastel Accents */
      --accent-primary: #b3c5d7;
      --accent-hover: #9bb3cc;
      --accent-glow: rgba(179, 197, 215, 0.4);
      --accent-text: #2f4858;

      /* Status Pastels */
      --success: #a3c9a8;
      --success-bg: #eaf3eb;
      --warning: #e8c593;
      --warning-bg: #fbf4ea;
      --info: #a2d2df;
      --info-bg: #ebf6f8;
      --danger: #eeb5b5;
      --danger-bg: #fdf2f2;
      --gold: #d4a373;
      --gold-bg: #f9f3ec;

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 26px;
      --shadow-sm: 0 1px 3px rgba(100, 80, 60, 0.05);
      --shadow-md: 0 4px 8px rgba(100, 80, 60, 0.08);
      --shadow-lg: 0 10px 18px rgba(100, 80, 60, 0.12);
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Caveat', cursive, sans-serif;
      font-size: 1.25rem;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-elevated);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-subtle);
    }

    /* Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    /* Top Sync & Notification Banner */
    .sync-bar {
      background: #efe7db;
      border-bottom: 1px solid var(--border-color);
      padding: 0.6rem 1.5rem;
      font-size: 1.05rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--success);
      box-shadow: 0 0 6px var(--success);
      position: relative;
    }

    .status-dot.syncing {
      background-color: var(--info);
      box-shadow: 0 0 6px var(--info);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    .sync-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 1rem;
      font-size: 1.15rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      font-family: inherit;
    }

    /* Pastel Button Variations */
    .btn-primary {
      background: var(--accent-primary);
      color: var(--accent-text);
      border-color: #a1b5c9;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .btn-ghost {
      background: var(--bg-surface);
      color: var(--text-main);
    }
    .btn-ghost:hover {
      background: var(--bg-elevated);
    }

    .btn-source {
      background: var(--success-bg);
      color: #3b6e4c;
      border-color: #c0dec4;
    }
    .btn-source:hover {
      background: #def0df;
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.05rem;
      user-select: none;
    }

    /* Header */
    header {
      padding: 2.5rem 0 1.5rem;
      background: radial-gradient(circle at 50% 0%, #f3ece0 0%, transparent 70%);
    }

    .header-content {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header-title-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.2rem 0.9rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 9999px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-text);
      letter-spacing: 0.03em;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      line-height: 1.1;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.25rem;
      margin-top: 0.25rem;
    }

    /* Stats Banner */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .stat-card:hover {
      border-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .stat-icon {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      background: var(--bg-surface);
      flex-shrink: 0;
    }

    .stat-info {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text-main);
    }

    .stat-label {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* Category Nav Tabs */
    .nav-tabs-wrapper {
      position: sticky;
      top: 45px;
      z-index: 40;
      background: var(--bg-primary);
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.2rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
      font-family: inherit;
    }

    .tab-btn:hover {
      background: var(--bg-elevated);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--accent-primary);
      border-color: #a1b5c9;
      color: var(--accent-text);
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .tab-count {
      padding: 0.1rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.6);
    }

    /* Filter & Search Bar */
    .filter-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: var(--shadow-sm);
    }

    .search-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.5rem 1rem 0.5rem 2.6rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 1.2rem;
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      font-size: 1.1rem;
      pointer-events: none;
    }

    .filter-controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .select-filter {
      padding: 0.45rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .select-filter:focus {
      border-color: var(--accent-primary);
    }

    /* Quick Filter Chips */
    .filter-chips {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .chip-label {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-subtle);
      margin-right: 0.25rem;
    }

    .chip {
      padding: 0.25rem 0.9rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 9999px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
      font-family: inherit;
    }

    .chip:hover {
      border-color: var(--text-subtle);
      color: var(--text-main);
    }

    .chip.active {
      background: var(--accent-primary);
      border-color: #a1b5c9;
      color: var(--accent-text);
    }

    /* Content Area */
    .content-area {
      margin-bottom: 4rem;
    }

    /* Section Headers */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.25rem;
    }

    .section-title {
      font-size: 1.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .results-count {
      font-size: 1.15rem;
      color: var(--text-muted);
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .media-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .media-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-primary);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .media-card.is-favorite {
      border-color: var(--gold);
    }
    .media-card.is-favorite::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #e8c593, #d4a373);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-main);
    }

    .favorite-badge {
      color: var(--gold);
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .rating-container {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .star-display {
      color: var(--gold);
      letter-spacing: 1px;
      font-size: 1.1rem;
    }

    .rating-number {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
    }

    .badge {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      text-transform: capitalize;
    }

    .badge-finished {
      background: var(--success-bg);
      color: #3b6e4c;
      border: 1px solid #c0dec4;
    }

    .badge-progress {
      background: var(--info-bg);
      color: #2b6d7c;
      border: 1px solid #bce1e8;
    }

    .badge-quit {
      background: var(--danger-bg);
      color: #8c3b3b;
      border: 1px solid #f2cfcf;
    }

    .badge-jumping {
      background: var(--warning-bg);
      color: #8a622a;
      border: 1px solid #f3dcba;
    }

    .badge-genre {
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .badge-age {
      background: #fdfbf7;
      color: var(--text-subtle);
      border: 1px solid var(--border-color);
    }

    .card-comments {
      background: #faf6f0;
      border-left: 3px solid var(--accent-primary);
      padding: 0.6rem 0.8rem;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 1.15rem;
      color: var(--text-main);
      line-height: 1.4;
      margin-top: auto;
    }

    /* Wishlist & Links Panel */
    .aux-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    @media (max-width: 900px) {
      .aux-grid {
        grid-template-columns: 1fr;
      }
    }

    .aux-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .aux-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .wishlist-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .wishlist-item {
      padding: 0.5rem 0.8rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .release-tag {
      font-size: 0.95rem;
      font-weight: 600;
      color: #8a622a;
      background: var(--warning-bg);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      white-space: nowrap;
      border: 1px solid #f3dcba;
    }

    .websites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
    }

    .website-link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.6rem 0.5rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
    }
    .website-link:hover {
      background: var(--accent-primary);
      border-color: #a1b5c9;
      color: var(--accent-text);
      transform: translateY(-2px);
    }

    /* Modal / Setup Drawer */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(74, 64, 54, 0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1.5rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2rem;
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.7rem;
      cursor: pointer;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      opacity: 0.6;
    }

    /* Footer */
    footer {
      margin-top: auto;
      border-top: 1px solid var(--border-color);
      padding: 2rem 0;
      background: var(--bg-surface);
      text-align: center;
      font-size: 1.15rem;
      color: var(--text-muted);
    }

    /* Responsive */
    @media (max-width: 640px) {
      h1 { font-size: 2.2rem; }
      .cards-grid { grid-template-columns: 1fr; }
      .search-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="sync-bar">
    <div class="sync-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText"><strong>Source:</strong> Connected to Google Sheet (Stuff)</span>
      <span style="color: var(--text-subtle); font-size: 0.95rem;" id="lastSyncTime">Last synced: Just now</span>
    </div>
    <div class="sync-actions">
      <label class="toggle-label">
        <input type="checkbox" id="autoSyncToggle" checked> Auto-sync (60s)
      </label>
      <button class="btn btn-ghost" id="syncBtn" onclick="triggerManualSync()">
        <span id="syncIcon">🔄</span> Sync Now
      </button>
      <a class="btn btn-source" href="https://docs.google.com/spreadsheets/d/1KcRb6_RXf7lYUTSoYv0j5y67eO9Sk-JkiiLDkmAt-sM/edit" target="_blank">
        📊 Open Source Sheet
      </a>
      <button class="btn btn-ghost" onclick="openSetupModal()">
        ⚙️ Settings & Setup
      </button>
    </div>
  </div>

  <header>
    <div class="container">
      <div class="header-content">
        <div class="header-title-area">
          <div>
            <div class="brand-badge">✨ Dynamic Media Hub</div>
            <h1>Personal Media & Reading Dashboard</h1>
            <p class="subtitle">Live tracking for Books, Movies, TV Shows, Games, Musicals, and Concerts</p>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" style="color: #7b8ea4;">📚</div>
            <div class="stat-info">
              <span class="stat-value" id="statTotalBooks">116</span>
              <span class="stat-label">Books Read</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="color: #d89aa8;">🎬</div>
            <div class="stat-info">
              <span class="stat-value" id="statTotalScreen">196</span>
              <span class="stat-label">Movies & Shows</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="color: #6fa076;">✅</div>
            <div class="stat-info">
              <span class="stat-value" id="statTotalFinished">250</span>
              <span class="stat-label">Completed</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="color: #70a6b5;">📖</div>
            <div class="stat-info">
              <span class="stat-value" id="statInProgress">30</span>
              <span class="stat-label">In Progress</span>
            </div>
          </div>
